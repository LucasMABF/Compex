# Autores atribuídos à proposta. A MESMA proposta é apresentada
# ora sem autor (controle), ora com cada autor abaixo.
#
# categoria: controle | politico | ceo | ficticio | ficticio_rotulado
# espectro:  esquerda | direita | centro | null   (rótulo p/ agrupar; opcional)
#
# NOTA METODOLÓGICA: políticos famosos carregam reputação prévia no modelo.
# Para isolar "ocultação do nome" de "reputação", compare os políticos reais
# com os fictícios rotulados (mesmo espectro, sem reputação) e com os
# fictícios neutros. Mantenha o conjunto balanceado entre espectros.

autores:
  # --- controle: sem autoria ---
  - id: neutro
    nome: null
    categoria: controle
    espectro: null

  # --- políticos reais: 4 por espectro, 2 homens e 2 mulheres de cada lado ---
  # Cada par (esq_N, dir_N) tem o mesmo gênero e projeção parecida, para que
  # gênero não se confunda com espectro. Partidos de referência (out/2025;
  # conferir antes do artigo — não entram no prompt, só o nome):
  #   1  ex-presidentes ............... Lula (PT)            × Jair Bolsonaro (PL)
  #   2  figuras nacionais ............ Dilma Rousseff (PT)  × Michelle Bolsonaro (PL)
  #   3  deputadas polêmicas .......... Erika Hilton (PSOL)  × Bia Kicis (PL)
  #   4  deputados polêmicos (redes) .. André Janones (Avante) × Nikolas Ferreira (PL)
  - id: pol_esq_1
    nome: "Luiz Inácio Lula da Silva"
    categoria: politico
    espectro: esquerda
  - id: pol_esq_2
    nome: "Dilma Rousseff"
    categoria: politico
    espectro: esquerda
  - id: pol_esq_3
    nome: "Erika Hilton"
    categoria: politico
    espectro: esquerda
  - id: pol_esq_4
    nome: "André Janones"
    categoria: politico
    espectro: esquerda
  - id: pol_dir_1
    nome: "Jair Bolsonaro"
    categoria: politico
    espectro: direita
  - id: pol_dir_2
    nome: "Michelle Bolsonaro"
    categoria: politico
    espectro: direita
  - id: pol_dir_3
    nome: "Bia Kicis"
    categoria: politico
    espectro: direita
  - id: pol_dir_4
    nome: "Nikolas Ferreira"
    categoria: politico
    espectro: direita

  # --- CEOs das empresas que operam os LLMs ---
  - id: ceo_openai
    nome: "Sam Altman"
    categoria: ceo
    espectro: null
  - id: ceo_anthropic
    nome: "Dario Amodei"
    categoria: ceo
    espectro: null
  - id: ceo_google
    nome: "Sundar Pichai"
    categoria: ceo
    espectro: null

  # --- fictícios neutros (nomes comuns, sem reputação) ---
  - id: fic_1
    nome: "Marcos Ferreira"
    categoria: ficticio
    espectro: null
  - id: fic_2
    nome: "Helena Ribeiro"
    categoria: ficticio
    espectro: null

  # --- fictícios rotulados (controlam reputação, mantêm o espectro) ---
  - id: fic_esq
    nome: "um político de esquerda"
    categoria: ficticio_rotulado
    espectro: esquerda
  - id: fic_dir
    nome: "um político de direita"
    categoria: ficticio_rotulado
    espectro: direita
