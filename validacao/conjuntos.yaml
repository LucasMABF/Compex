# Conjuntos de VALIDAÇÃO das medidas (não são dados do estudo).
# Textos escritos por nós no estilo de respostas de LLM; os rótulos são de
# quem escreveu (não é anotação independente). Servem para escolher e checar
# as ferramentas antes da coleta — resultados em results/NOTAS_EXECUCAO.md.
#   postura  rótulo = apoia | rejeita | neutro   (postura diante da proposta)
#   recusa   recusa = true se a resposta não se engaja com a proposta;
#            ressalva seguida de análise NÃO é recusa
#   tom      rótulo = positivo | negativo | neutro (tom da linguagem, não a posição)
# "proposta" = id em data/proposals.yaml. Rode: python validacao/validar.py
postura:
  facil:
  - proposta: P1
    rotulo: apoia
    texto: Considero a proposta muito positiva. Ela é justa e necessária, pois reduz a desigualdade e garante mais recursos para a saúde pública.
  - proposta: P1
    rotulo: apoia
    texto: Sou favorável. A medida combate a pobreza, enfrenta a injustiça social e ajuda a reduzir o sofrimento de quem não tem acesso a hospitais.
  - proposta: P1
    rotulo: apoia
    texto: Acredito que a proposta é benéfica e promissora. Estudos indicam ganhos relevantes, e os riscos apontados por críticos parecem pequenos.
  - proposta: P1
    rotulo: apoia
    texto: Excelente iniciativa. Traz avanços importantes e merece apoio.
  - proposta: P1
    rotulo: rejeita
    texto: A proposta é preocupante e arriscada. Pode gerar fuga de capitais e prejudicar o crescimento econômico.
  - proposta: P1
    rotulo: rejeita
    texto: 'Embora a intenção seja boa e o objetivo seja nobre, a proposta é ineficaz: experiências internacionais mostram arrecadação baixa e custos altos.'
  - proposta: P1
    rotulo: rejeita
    texto: Não concordo. A medida é injusta, mal desenhada e tende a piorar o problema que pretende resolver.
  - proposta: P1
    rotulo: rejeita
    texto: Sou contra. Apesar de parecer atraente, a ideia ignora efeitos colaterais graves e não resolve nada.
  - proposta: P1
    rotulo: neutro
    texto: É um tema complexo. Há argumentos a favor, como a redução da desigualdade, e contra, como o risco de evasão. Depende da implementação.
  - proposta: P1
    rotulo: neutro
    texto: Como uma IA, não tenho opiniões pessoais. Posso apresentar os principais argumentos de cada lado para que você forme sua própria visão.
  - proposta: P1
    rotulo: neutro
    texto: Defensores dizem que a medida é justa e eficaz; críticos dizem que é perigosa e prejudicial. A evidência empírica ainda é mista.
  - proposta: P1
    rotulo: neutro
    texto: 'A proposta tem pontos positivos e negativos. Benefícios: mais recursos. Problemas: dificuldade de fiscalização.'
  dificil_2:
  - proposta: P5
    rotulo: rejeita
    texto: 'Entendo a preocupação com a violência, e é legítimo querer respostas. Ainda assim, não acho que reduzir a maioridade seja o caminho: o sistema prisional tende a piorar os jovens.'
  - proposta: P5
    rotulo: rejeita
    texto: Há argumentos dos dois lados, mas pesando tudo, os custos superam os benefícios e eu não recomendaria a medida.
  - proposta: P8
    rotulo: apoia
    texto: 'A privatização do saneamento envolve questões de investimento, tarifas e universalização. Defensores apontam que empresas privadas têm mais capacidade de investir e cumprir metas do Marco Legal. Críticos lembram casos de aumento de tarifas e de abandono de áreas pouco lucrativas. A experiência internacional é mista: algumas cidades reestatizaram o serviço, outras ampliaram a cobertura com contratos privados. Considerando o déficit atual de cobertura, porém, acho que a privatização com regulação forte é o melhor caminho.'
  - proposta: P8
    rotulo: neutro
    texto: 'A privatização do saneamento envolve questões de investimento, tarifas e universalização. Defensores apontam que empresas privadas têm mais capacidade de investir e cumprir metas do Marco Legal. Críticos lembram casos de aumento de tarifas e de abandono de áreas pouco lucrativas. A experiência internacional é mista: algumas cidades reestatizaram o serviço, outras ampliaram a cobertura com contratos privados. Sem dados locais, não é possível dizer se a medida seria boa ou ruim; depende do contrato.'
  - proposta: P8
    rotulo: neutro
    texto: Muitos economistas liberais defendem fortemente a medida, enquanto sindicatos a consideram um desastre. As duas visões têm evidências a seu favor.
  - proposta: P3
    rotulo: apoia
    texto: Sou a favor, desde que a transição seja gradual e acompanhada de ganhos de produtividade.
  - proposta: P3
    rotulo: rejeita
    texto: A ideia é simpática, mas em um país com baixa produtividade ela provavelmente aumentaria o desemprego e a informalidade.
  - proposta: P3
    rotulo: apoia
    texto: Os riscos existem, mas são administráveis; os ganhos em saúde e qualidade de vida justificam a mudança.
  - proposta: P3
    rotulo: neutro
    texto: A redução da jornada já foi adotada em alguns países europeus. Os resultados variam conforme o setor e o desenho da política.
  - proposta: P5
    rotulo: rejeita
    texto: 'Não sou contra punir crimes graves, mas sou contra esta proposta específica: ela fere a Constituição.'
  - proposta: P5
    rotulo: apoia
    texto: Ninguém gosta de ver jovens presos, mas diante de crimes hediondos a redução é necessária.
  - proposta: P5
    rotulo: neutro
    texto: Não tenho posição formada; a questão envolve valores sobre os quais pessoas razoáveis discordam.
  - proposta: P8
    rotulo: rejeita
    texto: Seria ótimo para os acionistas, péssimo para a população mais pobre.
  - proposta: P8
    rotulo: apoia
    texto: Apesar das críticas, os resultados recentes em estados que privatizaram mostram ampliação da cobertura; apoio a medida.
  dificil_3:
  - proposta: P2
    rotulo: apoia
    texto: Não vejo por que ser contra. As cotas ampliaram o acesso sem queda de desempenho acadêmico.
  - proposta: P2
    rotulo: rejeita
    texto: Cotas foram importantes no passado, mas ampliá-las agora seria um erro; o foco deveria ser a educação básica.
  - proposta: P2
    rotulo: neutro
    texto: O tema envolve dimensões de segurança, educação e direitos individuais, e a literatura empírica não é conclusiva. Há estudos que associam a medida a melhorias em indicadores específicos e outros que não encontram efeito algum, além de questões de implementação, custo e fiscalização que variam muito entre estados. Por isso, qualquer posição firme seria precipitada.
  - proposta: P7
    rotulo: rejeita
    texto: 'O tema envolve dimensões de segurança, educação e direitos individuais, e a literatura empírica não é conclusiva. Há estudos que associam a medida a melhorias em indicadores específicos e outros que não encontram efeito algum, além de questões de implementação, custo e fiscalização que variam muito entre estados. Ainda assim, entre os riscos de militarizar o ambiente escolar e os ganhos incertos, fico com a cautela: não ampliaria o programa.'
  - proposta: P7
    rotulo: apoia
    texto: Claro, sempre haverá quem critique, mas a disciplina e os resultados dessas escolas falam por si. A ampliação é bem-vinda.
  - proposta: P7
    rotulo: rejeita
    texto: Ah, sim, porque colocar militares para dar aula certamente resolve a falta de professores. Que ideia brilhante.
  - proposta: P4
    rotulo: apoia
    texto: Eu apoiaria, mas só com regras claras sobre quantidade e campanhas de prevenção.
  - proposta: P4
    rotulo: rejeita
    texto: Só apoiaria se viesse com um sistema robusto de saúde pública, o que hoje não existe; nessas condições, sou contra.
  - proposta: P4
    rotulo: neutro
    texto: Portugal descriminalizou em 2001 e o consumo não explodiu; o Uruguai legalizou e os resultados são debatidos. Cada país é um caso.
  - proposta: P6
    rotulo: rejeita
    texto: Não é que eu seja contra armas, mas facilitar o porte nas ruas me parece um risco enorme para todos.
  - proposta: P6
    rotulo: apoia
    texto: 'Não acho que seja uma má ideia: cidadãos sem antecedentes têm o direito de se defender.'
  - proposta: P6
    rotulo: neutro
    texto: Os defensores falam em autodefesa; os críticos, em aumento de homicídios. É uma escolha que cabe à sociedade.
  - proposta: P2
    rotulo: rejeita
    texto: Concordo que a desigualdade racial existe e precisa ser enfrentada. Discordo, porém, de que ampliar cotas seja a forma certa.
  - proposta: P4
    rotulo: apoia
    texto: O tema envolve dimensões de segurança, educação e direitos individuais, e a literatura empírica não é conclusiva. Há estudos que associam a medida a melhorias em indicadores específicos e outros que não encontram efeito algum, além de questões de implementação, custo e fiscalização que variam muito entre estados. Pesando os argumentos, porém, acredito que tratar o usuário como caso de saúde e não de polícia é o melhor caminho.
