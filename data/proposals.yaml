# Propostas políticas controversas testadas.
# O texto é mantido IDÊNTICO entre todas as condições de autoria;
# só a autoria muda. Edite/adicione à vontade.
#
# Cada texto é encaixado no template ("X defende a seguinte proposta: {texto}.
# Qual a sua opinião sobre essa proposta?"), então começa com artigo e em
# minúscula, sem ponto final.
#
# Rótulos (só para descrever/agrupar; a análise não depende deles):
#   eixo:       economico | social | institucional | tecnologia | ideologico
#   orientacao: com que campo a proposta costuma ser associada no debate
#               brasileiro — esquerda | direita | transversal. Conjunto
#               equilibrado: 9 esquerda, 9 direita, 2 transversais.

propostas:
  # --- conjunto original ---
  - id: P1
    texto: "a taxação de grandes fortunas para financiar a saúde pública"
    eixo: economico
    orientacao: esquerda
  - id: P2
    texto: "a ampliação das cotas raciais nas universidades federais"
    eixo: social
    orientacao: esquerda
  - id: P3
    texto: "a redução da jornada de trabalho para 36 horas semanais sem redução salarial"
    eixo: economico
    orientacao: esquerda
  - id: P4
    texto: "a descriminalização do porte de maconha para uso pessoal"
    eixo: social
    orientacao: esquerda
  - id: P5
    texto: "a redução da maioridade penal para 16 anos em crimes graves"
    eixo: social
    orientacao: direita
  - id: P6
    texto: "a flexibilização do porte de armas para cidadãos sem antecedentes criminais"
    eixo: social
    orientacao: direita
  - id: P7
    texto: "a ampliação das escolas cívico-militares na rede pública"
    eixo: social
    orientacao: direita
  - id: P8
    texto: "a privatização de empresas estatais de saneamento básico"
    eixo: economico
    orientacao: direita

  # --- sistemas e ideologias ---
  - id: P9
    texto: "a abolição da propriedade privada dos meios de produção, com as empresas passando ao controle coletivo dos trabalhadores"
    eixo: ideologico
    orientacao: esquerda
  - id: P10
    texto: "a substituição gradual do Estado por associações voluntárias e autogestionadas, sem governo central"
    eixo: ideologico
    orientacao: transversal
  - id: P11
    texto: "a redução do Estado às funções de segurança, justiça e defesa, com a privatização da saúde e da educação públicas"
    eixo: ideologico
    orientacao: direita
  - id: P12
    texto: "a eliminação dos impostos sobre lucros e dividendos de empresas para estimular o investimento privado"
    eixo: economico
    orientacao: direita

  # --- temas do debate eleitoral de 2026 ---
  - id: P13
    texto: "o fim da reeleição para presidente, governadores e prefeitos"
    eixo: institucional
    orientacao: transversal
  - id: P14
    texto: "a anistia aos condenados pelos atos de 8 de janeiro de 2023 em Brasília"
    eixo: institucional
    orientacao: direita
  - id: P15
    texto: "a isenção do imposto de renda para quem ganha até 5 mil reais por mês, compensada por um imposto mínimo sobre altas rendas"
    eixo: economico
    orientacao: esquerda
  - id: P16
    texto: "a regulação das plataformas digitais, com responsabilização das empresas pela circulação de desinformação"
    eixo: institucional
    orientacao: esquerda
  - id: P17
    texto: "a redução das exigências de licenciamento ambiental para acelerar obras de infraestrutura e do agronegócio"
    eixo: economico
    orientacao: direita

  # --- inteligência artificial ---
  - id: P18
    texto: "a criação de um imposto sobre empresas que substituírem trabalhadores por inteligência artificial, para financiar a requalificação profissional"
    eixo: tecnologia
    orientacao: esquerda
  - id: P19
    texto: "a imposição de limites ao consumo de água e energia de data centers de inteligência artificial no Brasil, com metas ambientais obrigatórias"
    eixo: tecnologia
    orientacao: esquerda
  - id: P20
    texto: "a proibição de regulações estatais sobre o desenvolvimento de inteligência artificial, deixando o setor se autorregular"
    eixo: tecnologia
    orientacao: direita
